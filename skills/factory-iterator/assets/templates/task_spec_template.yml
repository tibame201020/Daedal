id: "task_X_1_1" # 必須與 tracker.json 中的 ID 完全一致
title: "任務標題"
objective: "客觀具體目標描述"

# 🎨 視覺與畫面感要求 (Visual Requirements)
visual_requirements:
  design_tokens_ref: "docs/design_system.md" # 引用全域設計規範
  layout_spec: "例如：左側導航、中央主表、右側抽屜"
  mockup_description: "描述該畫面應有的視覺動態、間距感（如：緊湊或呼吸感）"
  wireframe_refs:   # 📎 視覺產出物路徑參照（由 Visual Designer 產出，Worker 必須參考）
    - "docs/wireframes/dashboard_L1.png"
    # - "docs/wireframes/dashboard_L2.png"

acceptance_criteria:
  - "建立 OOO 或實作 XXX"
  - "[禁令] 絕對不可以做ＯＯＯ"
  - "[Fallback] API Key 必須設定預設值"

# ⚖️ 治理與風險控制 (Governance & Risk Control)
grounding:
  allowed_paths: # 🛠️ 物理邊界（Ikaros 嚴禁飛出此範圍）
    - "src/modules/target_module/*"
  collision_map:
    risk_index: "LOW/MEDIUM/HIGH" # 基於路徑重疊情境的風險評級
    warning: "⚠️ 衝突預警：此任務寫入路徑與 A 任務重疊。"
  global_change_event: "是否觸發斷點重同步？(false/true)"
  reverse_chain_proof: "簡述此任務如何對齊 RFP 中的 ＯＯＯ 要求"

# ECC-Inspired fields
success_criteria:
  - "定義量化指標 (如：Lighthouse 效能 > 90)"
negative_test_cases:
  - "描述應被阻擋或妥善處理的異常輸入情境"
