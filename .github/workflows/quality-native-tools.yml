name: Daedal Native Quality Tools (advisory baseline)

on:
  pull_request:
    paths:
      - 'src/**'
      - 'test/**'
      - 'test-support/**'
      - 'scripts/quality/**'
      - 'crapkit.toml'
      - 'stryker.config.mjs'
      - 'docs/vnext/QUALITY_TOOL_POLICY.example.json'
      - '.github/workflows/quality-native-tools.yml'
  push:
    branches: [main, 'feat/vnext-*']
    paths:
      - 'src/**'
      - 'test/**'
      - 'test-support/**'
      - 'scripts/quality/**'
      - 'crapkit.toml'
      - 'stryker.config.mjs'
      - 'docs/vnext/QUALITY_TOOL_POLICY.example.json'
      - '.github/workflows/quality-native-tools.yml'

permissions:
  contents: read

jobs:
  native-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned standalone analysis tools (no runtime dependency)
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund @stryker-mutator/core@10.1.1 c8@10.1.3
          python -m venv "$RUNNER_TEMP/daedal-quality-venv"
          "$RUNNER_TEMP/daedal-quality-venv/bin/python" -m pip install crapkit==0.8.1
      - name: Run real crapkit + Istanbul function coverage
        run: |
          mkdir -p reports/quality
          "$RUNNER_TEMP/daedal-quality-venv/bin/python" -m crapkit doctor
          "$RUNNER_TEMP/daedal-quality-venv/bin/python" -m crapkit coverage --json > reports/quality/crapkit.json
      - name: Run real StrykerJS mutation (one production source module)
        run: node node_modules/@stryker-mutator/core/bin/stryker.js run
      - name: Validate native report shapes, source SHA and advisory metrics
        run: node scripts/quality/validate-native.mjs reports/quality/crapkit.json reports/mutation/mutation.json docs/vnext/QUALITY_TOOL_POLICY.example.json
